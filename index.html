<html lang="pt-BR">

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f0f4f8;
    color: #1e293b;
    line-height: 1.5;
    padding-bottom: 32px;
  }
  .container {
    max-width: 560px;
    margin: auto;
    padding: 20px 16px;
  }
  .logo {
    text-align: center;
    margin-bottom: 10px;
  }
  .logo img {
    max-width: 165px;
    width: 100%;
    height: auto;
  }
  .titulo {
    text-align: center;
    color: #003b64;
    font-size: 1.45rem;
    font-weight: 800;
  }
  .subtitulo {

    color: #64748b;

    margin-bottom: 18px;
  }
  .botao-app {
    display: block;
    width: 100%;
    text-align: center;
    padding: 16px;
    margin-bottom: 22px;
    background: linear-gradient(135deg, #00a8c8, #008ca8);
    color: #ffffff;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 800;
    font-size: 1.05rem;
    box-shadow: 0 4px 14px rgba(0, 168, 200, 0.35);
    border: none;
    cursor: pointer;
  }
  .botao-app:active {
    transform: scale(0.98);
  }
  .passo-card {
    background: #ffffff;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
  }
  .passo-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .num {
    background: #003b64;
    color: #ffffff;
    font-weight: 800;
    font-size: 0.85rem;
    min-width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .passo-titulo {
    color: #003b64;
    font-weight: 700;
    font-size: 1.02rem;
  }
  .passo-texto {
    font-size: 0.92rem;
    color: #334155;
    margin-bottom: 12px;
  }
  .print-wrapper {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 8px;
    text-align: center;
  }
  .print-wrapper img {
    max-width: 240px;
    width: 100%;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    cursor: zoom-in;
  }
  .print-legenda {
    display: block;
    font-size: 0.78rem;
    color: #64748b;
    margin-top: 6px;
  }
  .campos-lista {
    background: #f8fafc;
    border-left: 4px solid #00a8c8;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 0.88rem;
    margin-bottom: 12px;
  }
  .campos-lista li {
    margin-left: 16px;
    margin-bottom: 4px;
  }
  .alerta {
    background: #fffbeb;
    border-left: 4px solid #f59e0b;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    color: #92400e;
    margin-top: 18px;
  }
